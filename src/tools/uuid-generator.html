<article class="tool-panel" id="uuid-generator" data-tool-panel>
              <div class="panel-header"><h3>UUID generator</h3><p>Create RFC 4122 version 4 UUIDs.</p></div>
              <label>How many UUIDs?<input id="uuidCount" type="number" min="1" max="100" value="5" /></label>
              <div class="button-row"><button id="generateUuid" class="button primary">Generate UUIDs</button><button id="copyUuid" class="button secondary">Copy</button></div>
              <pre id="uuidOutput" class="result"></pre>
            </article>
