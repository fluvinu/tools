<article class="tool-panel" id="word-counter" data-tool-panel>
              <div class="panel-header"><h3>Word & Character Counter</h3><p>Count words, characters, and spaces in your text.</p></div>
              <textarea id="wordCounterInput" placeholder="Type or paste your text here..."></textarea>
              <div class="button-row"><button id="countWords" class="button primary">Count</button><button class="button ghost" data-clear="wordCounterInput,wordCounterOutput">Clear</button></div>
              <pre id="wordCounterOutput" class="result"></pre>
            </article>
