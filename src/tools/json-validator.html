<article class="tool-panel active" id="json-validator" data-tool-panel>
              <div class="panel-header"><h3>JSON validator</h3><p>Check whether JSON is valid and see parse errors.</p></div>
              <textarea id="jsonValidatorInput" spellcheck="false" placeholder='{"hello":"world"}'></textarea>
              <div class="button-row"><button id="validateJson" class="button primary">Validate JSON</button><button class="button ghost" data-clear="jsonValidatorInput,jsonValidatorOutput">Clear</button></div>
              <pre id="jsonValidatorOutput" class="result" aria-live="polite"></pre>
            </article>
