<article class="tool-panel" id="jwt-decoder" data-tool-panel>
              <div class="panel-header"><h3>JWT decoder</h3><p>Decode JWT header and payload without verifying the signature.</p></div>
              <textarea id="jwtInput" spellcheck="false" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."></textarea>
              <div class="button-row"><button id="decodeJwt" class="button primary">Decode JWT</button><button class="button ghost" data-clear="jwtInput,jwtOutput">Clear</button></div>
              <pre id="jwtOutput" class="result"></pre>
            </article>
