<article class="tool-panel" id="age-calculator" data-tool-panel>
              <div class="panel-header"><h3>Age calculator</h3><p>Calculate exact age from a date of birth to today or a custom date.</p></div>
              <div class="grid-two">
                <label>Date of birth<input id="birthDate" type="date" /></label>
                <label>Calculate age on<input id="ageOnDate" type="date" /></label>
              </div>
              <div class="button-row"><button id="calculateAge" class="button primary">Calculate age</button><button class="button ghost" data-clear="birthDate,ageOnDate,ageOutput">Clear</button></div>
              <pre id="ageOutput" class="result"></pre>
            </article>
