<article class="tool-panel" id="base64-encoder" data-tool-panel>
              <div class="panel-header"><h3>Base64 encoder</h3><p>Encode text to Base64 or decode it back to UTF-8.</p></div>
              <textarea id="base64Input" placeholder="Type text or Base64 here"></textarea>
              <div class="button-row"><button id="encodeBase64" class="button primary">Encode</button><button id="decodeBase64" class="button secondary">Decode</button><button class="button ghost" data-clear="base64Input,base64Output">Clear</button></div>
              <pre id="base64Output" class="result"></pre>
            </article>
