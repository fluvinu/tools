<article class="tool-panel" id="json-formatter" data-tool-panel>
              <div class="panel-header"><h3>JSON formatter</h3><p>Pretty-print or minify JSON for APIs and configs.</p></div>
              <textarea id="jsonFormatterInput" spellcheck="false" placeholder='{"compact":true,"items":[1,2,3]}'></textarea>
              <div class="button-row"><button id="formatJson" class="button primary">Format</button><button id="minifyJson" class="button secondary">Minify</button><button class="button ghost" data-clear="jsonFormatterInput,jsonFormatterOutput">Clear</button></div>
              <pre id="jsonFormatterOutput" class="result"></pre>
            </article>
