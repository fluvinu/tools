<article class="tool-panel" id="password-generator" data-tool-panel>
              <div class="panel-header"><h3>Password generator</h3><p>Create strong passwords with configurable character sets.</p></div>
              <div class="grid-two">
                <label>Length<input id="passwordLength" type="number" min="8" max="128" value="20" /></label>
                <label>Quantity<input id="passwordQuantity" type="number" min="1" max="20" value="5" /></label>
              </div>
              <div class="checkbox-grid">
                <label><input id="useUppercase" type="checkbox" checked /> Uppercase</label>
                <label><input id="useLowercase" type="checkbox" checked /> Lowercase</label>
                <label><input id="useNumbers" type="checkbox" checked /> Numbers</label>
                <label><input id="useSymbols" type="checkbox" checked /> Symbols</label>
              </div>
              <div class="button-row"><button id="generatePassword" class="button primary">Generate passwords</button><button id="copyPassword" class="button secondary">Copy</button></div>
              <pre id="passwordOutput" class="result"></pre>
            </article>
