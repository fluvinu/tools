<article class="tool-panel" id="url-encoder" data-tool-panel>
              <div class="panel-header"><h3>URL encoder</h3><p>Encode or decode URL components safely.</p></div>
              <textarea id="urlInput" placeholder="https://example.com/search?q=hello world"></textarea>
              <div class="button-row"><button id="encodeUrl" class="button primary">Encode</button><button id="decodeUrl" class="button secondary">Decode</button><button class="button ghost" data-clear="urlInput,urlOutput">Clear</button></div>
              <pre id="urlOutput" class="result"></pre>
            </article>
