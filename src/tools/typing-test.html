<article class="tool-panel" id="typing-test" data-tool-panel>
              <div class="panel-header"><h3>Typing speed test</h3><p>Test your typing speed and accuracy in a full-screen experience.</p></div>
              <div class="typing-stats">
                <div class="stat-box"><strong>Time:</strong> <span id="typingTime">60</span>s</div>
                <div class="stat-box"><strong>WPM:</strong> <span id="typingWpm">0</span></div>
                <div class="stat-box"><strong>Accuracy:</strong> <span id="typingAccuracy">100</span>%</div>
                <div class="stat-box"><strong>Errors:</strong> <span id="typingErrors">0</span></div>
              </div>
              <div id="typingTextDisplay" class="typing-text-display"></div>
              <textarea id="typingInput" spellcheck="false" placeholder="Start typing here..."></textarea>
              <div class="button-row"><button id="restartTyping" class="button primary">Restart test</button></div>
            </article>
