<article class="tool-panel" id="image-converter" data-tool-panel>
              <div class="panel-header"><h3>Image converter</h3><p>Convert common image files to PNG, JPEG, or WebP directly in the browser.</p></div>
              <label>Choose image<input id="imageInput" type="file" accept="image/*" /></label>
              <div class="grid-two">
                <label>Output format<select id="imageFormat"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label>
                <label>Quality (JPEG/WebP)<input id="imageQuality" type="number" min="10" max="100" value="92" /></label>
              </div>
              <div class="button-row"><button id="convertImage" class="button primary">Convert image</button><a id="downloadImage" class="button secondary" download="converted-image.png" href="#">Download converted file</a></div>
              <div id="imageOutput" class="qr-output" aria-live="polite">Converted image preview will appear here.</div>
            </article>
