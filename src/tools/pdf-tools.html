<article class="tool-panel" id="pdf-tools" data-tool-panel>
              <div class="panel-header"><h3>PDF tools</h3><p>Inspect PDF file details and create a clean print-to-PDF document from pasted text.</p></div>
              <label>Choose PDF<input id="pdfInput" type="file" accept="application/pdf" /></label>
              <textarea id="pdfText" placeholder="Paste notes, invoice text, or any content you want to print/save as PDF."></textarea>
              <div class="button-row"><button id="inspectPdf" class="button primary">Inspect PDF</button><button id="printPdfText" class="button secondary">Print text as PDF</button><button class="button ghost" data-clear="pdfText,pdfOutput">Clear</button></div>
              <pre id="pdfOutput" class="result"></pre>
            </article>
