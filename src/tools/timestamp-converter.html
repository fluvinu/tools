<article class="tool-panel" id="timestamp-converter" data-tool-panel>
              <div class="panel-header"><h3>Timestamp converter</h3><p>Convert Unix timestamps to dates and dates to Unix timestamps.</p></div>
              <div class="grid-two">
                <label>Unix timestamp<input id="timestampInput" type="text" placeholder="1715443200" /></label>
                <label>Date and time<input id="dateInput" type="datetime-local" /></label>
              </div>
              <div class="button-row"><button id="timestampToDate" class="button primary">Timestamp to date</button><button id="dateToTimestamp" class="button secondary">Date to timestamp</button><button id="useCurrentTime" class="button ghost">Use current time</button></div>
              <pre id="timestampOutput" class="result"></pre>
            </article>
